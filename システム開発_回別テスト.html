<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出題 | Moodle Quiz Scraper</title>
  <style>
    :root {
      --bg-main: #f8f9fa;
      --surface: #ffffff;
      --primary: #2563eb;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --correct: #17633b;
      --correctBack: #d3ffe8;
      --incorrect: #b42318;
      --incorrectBack: #ebc1be;
    }

    * { box-sizing: border-box; }
    .hidden { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-main);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: .85rem;
    }

    .app {
      width: min(720px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0 60px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stats {
      display: flex;
      gap: 24px;
      margin: 16px 0 24px;
      font-size: 14px;
      color: var(--muted);
    }

    .stats strong {
      color: var(--text);
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding-bottom: 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    button {
      font: inherit;
      font-weight: 600;
      font-size: 14px;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
      cursor: pointer;
    }

    button:hover { border-color: var(--primary); }
    button:active { transform: scale(.98); }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    #judgeButton, #resultRestart { background: var(--primary); color: white; border-color: var(--primary); }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
    }

    .question {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.6;
      margin: 4px 0 20px;
    }

    .feedback {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .feedback.correct { color: var(--correct); }
    .feedback.correctBack { color: var(--correctBack); }
    .feedback.incorrect { color: var(--incorrect); }
    .feedback.incorrectBack { color: var(--incorrectBack); }

    .answers {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .answer-choice {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      padding: 12px 14px;
      display: flex;
      gap: 10px;
      text-align: left;
      font: inherit;
      font-size: 15px;
      cursor: pointer;
    }

    .answer-choice:hover { border-color: var(--primary); }

    .answer-choice .key { font-weight: 700; color: var(--muted); }

    .answer-choice.selected {
      border-color: var(--primary);
      background: #dbeafe;
    }

    .answer-choice.correct {
      border-color: var(--correct);
      color: var(--correct);
      background-color: var(--correctBack);
    }

    .answer-choice.incorrect {
      border-color: var(--incorrect);
      color: var(--incorrect);
      background-color: var(--incorrectBack);
    }

    .answer-choice:disabled { cursor: default; }

    .written-answer { display: grid; gap: 8px; font-size: 15px; }
    .short-answer-input {
      width: 100%;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      opacity: 1;
    }
    .short-answer-input.correct { border-color: var(--correct); color: var(--correct); background: var(--correctBack); }
    .short-answer-input.incorrect { border-color: var(--incorrect); color: var(--incorrect); background: var(--incorrectBack); }

    .cloze-question { white-space: pre-wrap; line-height: 1.9; font-size: 16px; overflow-wrap: anywhere; }
    .cloze-input { display: inline-block; width: 12em; max-width: calc(100% - 8px); padding: 6px 10px; margin: 2px 4px; line-height: 1.5; vertical-align: baseline; }
    .cloze-question img { max-width: 100%; height: auto; vertical-align: middle; }
    #rightAnswer { white-space: pre-wrap; }

    .judge-row {
      margin-top: 12px;
    }

    .match-row {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 15px;
    }

    .match-row.correct { border-color: var(--correct); color: var(--correct); background-color: var(--correctBack);}
    .match-row.incorrect { border-color: var(--incorrect); color: var(--incorrect); background-color: var(--incorrectBack);}
    .match-row .term { font-weight: 700; }

    .match-row select {
      font: inherit;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      background: #fff;
      color: var(--text);
    }

    .note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      margin-top: 16px;
    }

    .results {
      text-align: center;
      padding: 40px 0;
    }

    .result-percent {
      font-size: 56px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .result-detail {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 24px;
      white-space: pre-line;
    }

    @media (max-width: 560px) {
      .match-row { grid-template-columns: 1fr; }
    }
  
    .panel { background: white; padding: 20px; border: 1px solid var(--border); border-radius: 16px; margin: 20px 0; }
    .rounds { display: grid; grid-template-columns: repeat(auto-fit,minmax(190px,1fr)); gap: 12px; }
    .round { text-align: left; line-height: 1.7; }
    .round strong, .round small { display: block; }
    .round small, .hint { color: var(--muted); }
    .section-title { font-size: 17px; margin: 0 0 14px; }
    .history-row { padding: 12px 0; border-bottom: 1px solid var(--border); line-height: 1.8; }
    .history-row summary { cursor: pointer; }
    #saveStatus { margin-top: 12px; white-space: pre-line; }
    #storageNotice { line-height: 1.7; }
  </style>
</head>

  <div class="app">
    <h1 id="folderName">出題</h1>
    <div class="subtitle" id="folderInfo"></div>
    <div id="storageNotice" class="hint" role="status"></div>

      <button id="judgeButton">答え合わせ</button>
    </div>

    <div class="results hidden" id="results">
      <div class="result-percent" id="resultPercent">0%</div>

      <button id="resultRestart">この回にもう一度挑戦する</button>

    </div>
    </div>
    <section class="panel">
      <h2 class="section-title">受験履歴</h2>
      <p class="hint">完了した受験の日時・正解率・問題ごとの結果を、このブラウザに最大500件保存します。途中で終了した受験は記録されません。</p>
      <button id="downloadHistory">履歴をJSONで保存</button>
      <div id="history"></div>
    </section>
  </div>

  <script>
// 保存一覧・演習・単体HTMLで共通の問題形式と重複判定。
(() => {
  const clean = value => String(value ?? '').replace(/\s+/g, ' ').trim();
  const types = new Set(['shortanswer', 'multichoice', 'truefalse', 'match', 'numerical', 'essay', 'multianswer', 'description', 'ordering', 'ddwtos', 'gapselect']);
  const typeOf = question => {
    for (const value of [question.type, ...(question.classes || [])]) {
      const type = String(value || '').replace(/^qtype_/, '');
      if (types.has(type)) return type;
    }
    return question.type || '';
  };
  const normalize = question => ({ ...question, type: typeOf(question) });
  const isCloze = question => typeOf(question) === 'multianswer';
  const blankAnswerText = answer => String(answer?.rightAnswer || (answer?.markedCorrect ? answer.text : '') || '').trim();
  const identity = question => {
    const type = typeOf(question);
    const text = clean(question.questionText);
    const images = (question.questionImages || []).map(image => image.src || '');
    if (!text && !images.length) return null;
    let choices = [];
    if (isCloze(question)) {
      choices = [
        (question.questionParts || []).map(part => 'blank' in part ? ['blank', part.blank] : part.image ? ['image', part.image.src] : ['text', clean(part.text)]),
        (question.answers || []).map(answer => [answer.kind || 'text', (answer.options || [])
          .filter(option => option.value !== '').map(option => clean(option.text)).sort()]),
      ];
    } else if (type === 'match') {
      choices = (question.answers || []).map(row => JSON.stringify([
        clean(row.prompt), (row.options || []).filter(option => option.value !== '0' && option.value !== '')
          .map(option => clean(option.text)).sort(),
      ])).sort();
    } else if (type !== 'shortanswer') {
      choices = (question.answers || []).map(answer => clean(answer.text)).sort();
    }
    // 回答順、選択状態、受験時の正誤、レビューURLは問題そのものには含めない。
    return JSON.stringify([type, text, images, choices]);
  };
  const answerQuality = question => isCloze(question)
    ? (question.answers || []).filter(answer => blankAnswerText(answer)).length
    : (clean(question.rightAnswer) ? 2 : 0)
    + ((question.answers || []).some(answer => answer.markedCorrect || answer.selectedCorrectly) ? 1 : 0);
  const buildPool = folder => {
    const unique = new Map();
    for (const quiz of folder.quizzes || []) {
      for (const raw of quiz.questions || []) {
        const question = { ...normalize(raw), sourceTitle: clean(quiz.title) };
        const key = identity(question) ?? Symbol();
        const previous = unique.get(key);
        // 再取得した不完全なデータで、既存の正解を失わない。
        const preferred = !previous || answerQuality(question) >= answerQuality(previous) ? question : previous;
        if (previous && isCloze(preferred)) {
          const other = preferred === question ? previous : question;
          unique.set(key, { ...preferred, answers: (preferred.answers || []).map((answer, index) =>
            blankAnswerText(answer) ? answer : { ...answer, rightAnswer: blankAnswerText(other.answers?.[index]) }) });
        } else {
          unique.set(key, preferred);
        }
      }
    }
    return [...unique.values()];
  };
  globalThis.MMQuiz = { typeOf, normalize, isCloze, blankAnswerText, identity, buildPool };
})();

</script>

const state = {
  pool: [],
  queue: [],
  current: null,
  answered: false,
  answeredCount: 0,
  correctCount: 0,
  skippedCount: 0,
  outcomes: [],
  saved: false,
  startedAt: null,
  selectedQuiz: null,
};


const $ = (id) => document.getElementById(id);
const clean = (value) => String(value ?? '').replace(/\s+/g, ' ').trim();
const feedback = $('feedback');

const shuffle = (items) => {
  const array = [...items];
  for (let i = array.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
};

const renderStats = () => {
  const taken = state.pool.length - state.queue.length;
  $('progressCount').textContent = `${taken} / ${state.pool.length}`;
  $('correctCount').textContent = String(state.correctCount);
  $('skippedCount').textContent = String(state.skippedCount);
};

// 「正解: 」プレフィックスを除いた正解テキスト本体
const rightAnswerBody = (question) =>
  clean(question.rightAnswer).replace(/^[^:：]*[:：]\s*/, '');

// 記述式はカンマ・コロン・空白も解答の一部なので、選択式の分割処理を使わない。
const shortAnswerText = (question) => {
  const right = String(question.rightAnswer ?? '').trim()
    .replace(/^(?:正解|正しい答え|the correct answer is|correct answer)\s*[:：]\s*/i, '');
  if (right) return right;
  const answer = question.answers?.find((item) => item.markedCorrect);
  return String(answer?.text ?? '').trim();
};

// 正解の選択肢インデックスを求める。
// 正解した受験データなら markedCorrect が付いているが、
// 不正解だった問題は rightAnswer のテキストと突き合わせて判定する。
const correctIndices = (question) => {
  const body = rightAnswerBody(question);
  const parts = body ? body.split(/,\s*/).map(clean) : [];
  const indices = [];

  for (const [index, answer] of question.answers.entries()) {
    const text = clean(answer.text);
    if (answer.markedCorrect || (body && (text === body || parts.includes(text)))) {
      indices.push(index);
    }
  }

  return indices;
};

// Moodleの「正解: 用語 → 説明, 用語 → 説明, ...」を prompt → 正解テキスト のMapにする
const parseRightAnswerMap = (text) => {
  const map = new Map();
  const cleaned = clean(text);
  if (!cleaned) return map;
  const body = cleaned.replace(/^[^:：]*[:：]\s*/, '');
  for (const pair of body.split(/,\s*/)) {
    const [prompt, answer] = pair.split(/\s*→\s*/);
    if (prompt && answer) map.set(clean(prompt), clean(answer));
  }
  return map;
};

const setFeedback = (text, tone) => {
  feedback.textContent = text;
  feedback.className = tone ? `feedback ${tone}` : 'feedback';
};

const showRightAnswer = (question) => {
  const el = $('rightAnswer');
  const text = question?.type === 'shortanswer'
    ? (shortAnswerText(question) ? `正解: ${shortAnswerText(question)}` : '')
    : question && MMQuiz.isCloze(question)
      ? (question.answers || []).map((answer, index) => `空欄 ${index + 1}: ${MMQuiz.blankAnswerText(answer) || '正解データなし'}`).join('\n')
    : clean(question?.rightAnswer);
  if (!text) {
    el.classList.add('hidden');
    el.textContent = '';
    return;
  }
  el.textContent = text;
  el.classList.remove('hidden');
};

const finishQuestion = (isCorrect, incorrectMessage = '不正解。緑が正解、赤が誤答です。') => {
  state.outcomes.push({ number: state.current.number, id: state.current.id, result: isCorrect ? 'correct' : 'incorrect' });
  state.answeredCount += 1;
  if (isCorrect) state.correctCount += 1;
  renderStats();
  setFeedback(isCorrect ? '正解。「次の問題へ」で進んでください。' : incorrectMessage, isCorrect ? 'correct' : 'incorrect');
  showRightAnswer(state.current);
  $('nextButton').textContent = state.queue.length ? '次の問題へ' : '結果を見る';
};

const buildChoiceButton = (answer, index) => {
  const choiceLabel = answer.label || `${String.fromCharCode(97 + index)}.`;
  const rawText = clean(answer.text);
  const choiceText = rawText.startsWith(choiceLabel) ? rawText.slice(choiceLabel.length).trimStart() : rawText;
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'answer-choice';
  button.dataset.answerIndex = String(index);

  const key = document.createElement('span');
  key.className = 'key';
  key.textContent = choiceLabel;

  const body = document.createElement('span');
  body.className = 'body';
  body.textContent = choiceText || rawText;

  button.append(key, body);
  return button;
};

const markChoiceButtons = (correctSet, selectedSet) => {
  const buttons = [...$('answers').querySelectorAll('[data-answer-index]')];

  for (const button of buttons) {
    const index = Number(button.dataset.answerIndex);
    button.disabled = true;
    if (correctSet.has(index)) button.classList.add('correct');
    if (selectedSet.has(index) && !correctSet.has(index)) button.classList.add('incorrect');
    button.classList.remove('selected');
  }
};

const revealSingleChoice = (question, selectedIndex, correctSet) => {
  if (state.answered || state.current !== question) return;
  state.answered = true;
  $('judgeRow').classList.add('hidden');

  markChoiceButtons(correctSet, new Set([selectedIndex]));
  finishQuestion(correctSet.has(selectedIndex));
};

const judgeMultiChoice = (question, correctSet) => {
  if (state.answered || state.current !== question) return;

  const selected = new Set(
    [...$('answers').querySelectorAll('.answer-choice.selected')]
      .map((button) => Number(button.dataset.answerIndex))
  );

  if (!selected.size) {
    setFeedback('1つ以上選択してから答え合わせしてください。', '');
    return;
  }

  state.answered = true;
  $('judgeRow').classList.add('hidden');
  markChoiceButtons(correctSet, selected);

  const isCorrect = selected.size === correctSet.size && [...selected].every((index) => correctSet.has(index));
  finishQuestion(isCorrect);
};

const checkMatchProgress = (question) => {
  if (state.answered || state.current !== question) return;

  const selects = [...$('answers').querySelectorAll('select')];
  if (!selects.every((select) => select.value !== '')) return;

  state.answered = true;
  let allCorrect = true;

  for (const select of selects) {
    const row = select.closest('.match-row');
    select.disabled = true;
    const correctValue = select.dataset.correctValue;
    if (!correctValue) continue;
    if (select.value === correctValue) {
      row.classList.add('correct');
    } else {
      row.classList.add('incorrect');
      allCorrect = false;
    }
  }

  finishQuestion(allCorrect);
};

const renderShortAnswer = (question) => {
  const correctText = shortAnswerText(question);
  if (!correctText) {
    setFeedback('この記述問題は正解データがありません。「スキップ」で先へ進んでください。', '');
    return;
  }

  const li = document.createElement('li');
  const label = document.createElement('label');
  label.className = 'written-answer';
  const caption = document.createElement('span');
  caption.textContent = '回答';
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'short-answer-input';
  input.autocomplete = 'off';
  input.spellcheck = false;
  label.append(caption, input);
  li.appendChild(label);
  $('answers').appendChild(li);
  setFeedback('回答を入力して「答え合わせ」を押してください。表示された正解と文字・記号・空白を照合します（前後の空白は除く）。', '');

  const judge = () => {
    if (state.answered || state.current !== question) return;
    if (!input.value.trim()) {
      setFeedback('回答を入力してから答え合わせしてください。', '');
      return;
    }
    const isCorrect = input.value.trim() === correctText;
    state.answered = true;
    input.disabled = true;
    input.classList.add(isCorrect ? 'correct' : 'incorrect');
    $('judgeRow').classList.add('hidden');
    finishQuestion(isCorrect, '不正解。下に表示された正解を確認してください。');
  };
  $('judgeRow').classList.remove('hidden');
  $('judgeButton').onclick = judge;
  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.isComposing && event.keyCode !== 229) {
      event.preventDefault();
      judge();
    }
  });
};

const renderCloze = (question) => {
  if (!question.questionParts?.some(part => 'blank' in part) || !question.answers?.length) {
    setFeedback('この穴埋め問題には空欄の位置データがありません。Moodleの受験レビュー画面から再取得してください。', '');
    return;
  }
  $('questionText').classList.add('hidden');
  const body = document.createElement('li');
  body.className = 'cloze-question';
  const fields = [];
  for (const part of question.questionParts) {
    if ('text' in part) {
      body.append(document.createTextNode(part.text));
    } else if (part.image) {
      const image = document.createElement('img');
      image.src = part.image.src;
      image.alt = part.image.alt || '';
      body.append(image);
    } else if ('blank' in part) {
      const answer = question.answers[part.blank];
      const select = answer?.kind === 'select';
      const input = document.createElement(select ? 'select' : 'input');
      input.className = 'short-answer-input cloze-input';
      input.setAttribute('aria-label', `空欄 ${part.blank + 1}`);
      if (select) {
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = `(${part.blank + 1}) 選択…`;
        input.append(placeholder);
        for (const option of answer.options || []) {
          if (option.value === '') continue;
          const opt = document.createElement('option');
          opt.value = option.value;
          opt.textContent = option.text;
          input.append(opt);
        }
      } else {
        input.type = 'text';
        input.autocomplete = 'off';
        input.spellcheck = false;
        input.placeholder = `(${part.blank + 1})`;
      }
      body.append(input);
      fields.push({ input, answer, select });
    }
  }
  $('answers').append(body);
  if (question.unsupportedBlanks) {
    setFeedback('この問題には対応していない形式の空欄が含まれています。「スキップ」で先へ進んでください。', '');
    return;
  }
  if (fields.some(field => !MMQuiz.blankAnswerText(field.answer))) {
    setFeedback('一部の空欄の正解データがありません。受験レビュー画面から再取得するか「スキップ」で先へ進んでください。', '');
    return;
  }
  setFeedback('文章中の空欄をすべて埋めて「答え合わせ」を押してください。', '');
  const judge = () => {
    if (state.answered || state.current !== question) return;
    const empty = fields.find(field => !field.input.value.trim());
    if (empty) {
      setFeedback('すべての空欄を埋めてから答え合わせしてください。', '');
      empty.input.focus();
      return;
    }
    state.answered = true;
    let allCorrect = true;
    for (const { input, answer, select } of fields) {
      const response = select ? input.selectedOptions[0].textContent.trim() : input.value.trim();
      const correct = response === MMQuiz.blankAnswerText(answer);
      input.classList.add(correct ? 'correct' : 'incorrect');
      input.disabled = true;
      if (!correct) allCorrect = false;
    }
    $('judgeRow').classList.add('hidden');
    finishQuestion(allCorrect, '不正解の空欄があります。赤い入力欄と、下に表示された各空欄の正解を確認してください。');
  };
  $('judgeRow').classList.remove('hidden');
  $('judgeButton').onclick = judge;
  for (const { input } of fields) input.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.isComposing && event.keyCode !== 229) {
      event.preventDefault();
      judge();
    }
  });
};

const renderQuestion = (question) => {
  question = MMQuiz.normalize(question);
  state.current = question;
  state.answered = false;
  renderStats();
  $('nextButton').textContent = 'スキップ';
  $('questionText').classList.remove('hidden');
  const shownInPass = state.pool.length - state.queue.length;
  $('questionBadge').textContent = `第${question.number}問`;
  $('questionProgress').textContent = state.pool.length ? `${shownInPass} / ${state.pool.length}` : '';
  $('questionSource').textContent = question.sourceTitle || '';
  $('questionText').textContent = question.questionText || '(問題文なし)';
  setFeedback('答えを選ぶと、その場で答え合わせできます。', '');
  showRightAnswer(null);
  $('judgeRow').classList.add('hidden');

  const answers = $('answers');
  answers.innerHTML = '';

  if (MMQuiz.isCloze(question)) {
    renderCloze(question);
    return;
  }

  if (question.type === 'shortanswer' || question.type === 'numerical') {
    renderShortAnswer(question);
    return;
  }

  if (!question.answers?.length) {
    setFeedback('この問題には選択肢データがありません。「次にすすむ」で先へ進んでください。', '');
    return;
  }

  if (question.type === 'match') {
    const rightMap = parseRightAnswerMap(question.rightAnswer);
    setFeedback('全ての項目を選ぶと、自動で答え合わせされます。', '');

    for (const row of question.answers) {
      const li = document.createElement('li');
      li.className = 'match-row';

      const term = document.createElement('span');
      term.className = 'term';
      term.textContent = clean(row.prompt);

      const select = document.createElement('select');

      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = '選択...';
      select.appendChild(placeholder);

      // 正解の突き合わせ: rightAnswer のマップ、なければ受験時の selectedCorrectly を使う
      const correctText = rightMap.get(clean(row.prompt));
      let correctOption = (row.options || []).find((option) => clean(option.text) === correctText);
      if (!correctOption && row.selectedCorrectly) {
        correctOption = (row.options || []).find((option) => option.value === row.selectedValue);
      }
      select.dataset.correctValue = correctOption ? correctOption.value : '';

      for (const option of shuffle(row.options || [])) {
        const opt = document.createElement('option');
        opt.value = option.value;
        opt.textContent = clean(option.text);
        select.appendChild(opt);
      }

      select.addEventListener('change', () => checkMatchProgress(question));

      li.append(term, select);
      answers.appendChild(li);
    }
    return;
  }

  const correctSet = new Set(correctIndices(question));

  if (!correctSet.size) {
    setFeedback('この問題は正解データが特定できませんでした。「次にすすむ」で先へ進んでください。', '');
  }

  const multi = correctSet.size > 1;

  for (const answer of question.answers) {
    const li = document.createElement('li');
    li.appendChild(buildChoiceButton(answer, answer.index));
    answers.appendChild(li);
  }

  if (multi) {
    setFeedback(`正解は${correctSet.size}つあります。選択して「答え合わせ」を押してください。`, '');
    $('judgeRow').classList.remove('hidden');
    $('judgeButton').onclick = () => judgeMultiChoice(question, correctSet);
  }

  answers.querySelectorAll('[data-answer-index]').forEach((button) => {
    button.addEventListener('click', () => {
      if (state.answered) return;
      if (multi) {
        button.classList.toggle('selected');
      } else {
        revealSingleChoice(question, Number(button.dataset.answerIndex), correctSet);
      }
    });
  });
};

const showEmptyState = (message) => {
  $('questionBadge').textContent = '-';
  $('questionProgress').textContent = '';
  $('questionSource').textContent = '';
  $('questionText').textContent = message;
  $('answers').innerHTML = '';
  $('judgeRow').classList.add('hidden');
  $('nextButton').classList.add('hidden');
  setFeedback('', '');
  showRightAnswer(null);
};

// 全問終了後の結果画面。全問スキップなら 0% になる
const showResults = () => {
  state.current = null;
  renderStats();
  saveResult();

  const total = state.pool.length;
  const percent = total ? Math.round((state.correctCount / total) * 1000) / 10 : 0;

  $('resultPercent').textContent = `${percent}%`;
  $('resultDetail').textContent =
    `正解 ${state.correctCount} / ${total}問\n回答 ${state.answeredCount}問 ／ スキップ ${state.skippedCount}問`;

  $('questionBadge').textContent = '結果';
  $('questionProgress').textContent = '';
  $('questionSource').textContent = '';
  $('questionText').classList.add('hidden');
  $('answers').innerHTML = '';
  $('judgeRow').classList.add('hidden');
  $('nextButton').classList.add('hidden');
  setFeedback('', '');
  showRightAnswer(null);
  $('results').classList.remove('hidden');
};

const showNext = () => {
  if (!state.queue.length) {
    showResults();
    return;
  }
  renderQuestion(state.queue.shift());
};

// スキップ（未回答のまま進む）または回答後に次へ進む
const onNext = () => {
  if (!state.current) return;
  if (!state.answered) {
    state.skippedCount += 1;
    state.outcomes.push({ number: state.current.number, id: state.current.id, result: 'skipped' });
  }
  state.current = null;
  showNext();
};

const restart = () => {
  state.outcomes = [];
  state.saved = false;
  state.startedAt = new Date().toISOString();
  $('saveStatus').textContent = '';
  state.answeredCount = 0;
  state.correctCount = 0;
  state.skippedCount = 0;
  state.current = null;
  state.queue = [...state.pool];
  $('results').classList.add('hidden');
  $('nextButton').classList.remove('hidden');
  renderStats();

  if (!state.pool.length) {
    showEmptyState('このフォルダには問題がありません。');
    return;
  }

  showNext();
};

const buildPool = (folder) => MMQuiz.buildPool(folder);

// フォルダを、拡張機能なしで単体で動く静的HTML（CSS/JS/問題データ入り）として書き出す。
// HTML・出題処理・共通処理を取得して埋め込み、拡張機能と同じ処理で動かす。
// 注意: このファイル内に閉じscriptタグを文字列リテラルで書くと書き出したHTMLが壊れるため、必ず連結で作ること。
const exportStandaloneHtml = async (folder) => {
  const [htmlText, jsText, coreText] = await Promise.all([
    fetch(chrome.runtime.getURL('quiz.html')).then((res) => res.text()),
    fetch(chrome.runtime.getURL('quiz.js')).then((res) => res.text()),
    fetch(chrome.runtime.getURL('quiz-core.js')).then((res) => res.text()),
  ]);

  // JSON内の < をエスケープして、問題文に閉じタグがあってもscriptが壊れないようにする
  const data = JSON.stringify({ name: folder.name, quizzes: folder.quizzes }).replace(/</g, '\\u003c');
  const scriptOpen = '<' + 'script>';
  const scriptClose = '<' + '/script>';
  const externalTag = '<' + 'script src="quiz.js">' + scriptClose;
  const inlineScript = `${scriptOpen}\nwindow.__EMBEDDED_QUIZ__ = ${data};\n${jsText}\n${scriptClose}`;
  const coreTag = '<' + 'script src="quiz-core.js">' + scriptClose;
  const output = htmlText.replace(coreTag, () => `${scriptOpen}\n${coreText}\n${scriptClose}`)
    .replace(externalTag, () => inlineScript);

  const safeName = folder.name.replace(/[\\/:*?"<>|]+/g, '_').replace(/\s+/g, '_').slice(0, 80) || 'quiz';
  const timestamp = new Date().toISOString().slice(0, 10);
  const blob = new Blob([output], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');

  anchor.href = url;
  anchor.download = `${safeName}_出題_${timestamp}.html`;
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};


let quizFolder;
let storageKey;
let historyRecords = [];
let storageReady = true;
const shortTitle = quiz => quiz.title.split(':')[0].trim();
const quizKey = quiz => {
  try { return new URL(quiz.url).searchParams.get('cmid') || quiz.title; }
  catch { return quiz.title; }
};
const loadHistory = () => {
  try {
    const raw = localStorage.getItem(storageKey);
    const parsed = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(parsed) || !parsed.every(r => r && typeof r.quizKey === 'string' && typeof r.title === 'string' && typeof r.finishedAt === 'string' && Number.isFinite(r.percent) && Array.isArray(r.outcomes))) throw new Error('Invalid history');
    historyRecords = parsed;
    const probe = storageKey + ':probe';
    localStorage.setItem(probe, '1');
    localStorage.removeItem(probe);
    $('storageNotice').textContent = '履歴は同じブラウザ・同じファイルの場所で利用できます。ファイルの移動やブラウザのデータ削除に備え、必要な履歴はJSONで保存してください。';
  } catch {
    storageReady = false;
    $('storageNotice').textContent = '保存済み履歴の読み込み、またはブラウザへの保存ができません。この画面内では履歴を保持します。必要な結果は「履歴をJSONで保存」で保存してください。';
  }
};
const renderSelection = () => {
  $('rounds').replaceChildren();
  quizFolder.quizzes.forEach(quiz => {
    const records = historyRecords.filter(r => r.quizKey === quizKey(quiz));
    const button = document.createElement('button');
    button.className = 'round';
    const title = document.createElement('strong');
    title.textContent = shortTitle(quiz);
    const detail = document.createElement('small');
    detail.textContent = `${quiz.questions.length}問 ／ 受験 ${records.length}回`;
    const score = document.createElement('small');
    score.textContent = records.length ? `前回 ${records[0].percent}% ／ 最高 ${Math.max(...records.map(r => r.percent))}%` : '未受験';
    button.append(title, detail, score);
    button.addEventListener('click', () => {
      state.selectedQuiz = quiz;
      state.pool = quiz.questions.map(q => ({ ...MMQuiz.normalize(q), sourceTitle: shortTitle(quiz) }));
      $('selection').classList.add('hidden');
      $('exam').classList.remove('hidden');
      restart();
    });
    $('rounds').append(button);
  });
};
const renderHistory = () => {
  $('history').replaceChildren();
  if (!historyRecords.length) { $('history').textContent = 'まだ受験履歴はありません。'; return; }
  const labels = { correct: '正解', incorrect: '不正解', skipped: 'スキップ' };
  historyRecords.forEach(record => {
    const item = document.createElement('details');
    item.className = 'history-row';
    const summary = document.createElement('summary');
    summary.textContent = `${record.title} ｜ ${record.percent}% ｜ ${new Date(record.finishedAt).toLocaleString('ja-JP')}`;
    const detail = document.createElement('div');
    detail.textContent = `正解 ${record.correct} / ${record.total}問 ／ スキップ ${record.skipped}問`;
    const list = document.createElement('div');
    list.textContent = record.outcomes.map(q => `第${q.number}問：${labels[q.result] || q.result}`).join(' ／ ');
    item.append(summary, detail, list);
    $('history').append(item);
  });
};
const saveResult = () => {
  if (state.saved) return;
  state.saved = true;
  const total = state.pool.length;
  historyRecords.unshift({ quizKey: quizKey(state.selectedQuiz), title: shortTitle(state.selectedQuiz),
    startedAt: state.startedAt, finishedAt: new Date().toISOString(),
    total, correct: state.correctCount, answered: state.answeredCount, skipped: state.skippedCount,
    percent: total ? Math.round(state.correctCount / total * 1000) / 10 : 0,
    outcomes: state.outcomes.map(q => ({ ...q })) });
  historyRecords = historyRecords.slice(0, 500);
  try {
    if (!storageReady) throw new Error('Storage unavailable');
    localStorage.setItem(storageKey, JSON.stringify(historyRecords));
    $('saveStatus').textContent = '受験結果をブラウザに保存しました。';
  } catch {
    $('saveStatus').textContent = 'ブラウザに保存できませんでした。「履歴をJSONで保存」から結果を保存してください。';
  }
  renderHistory();
  renderSelection();
};

const init = async () => {
  // 書き出した単体HTMLではデータが埋め込まれている。拡張機能内ではストレージから読む
  const embedded = window.__EMBEDDED_QUIZ__;
  let folder = embedded || null;

  if (!folder) {
    const folderId = new URLSearchParams(location.search).get('folder');
    const { folders } = await chrome.storage.local.get('folders');
    folder = (Array.isArray(folders) ? folders : []).find((item) => item.id === folderId);
  }

  if (!folder) {
    showEmptyState('フォルダが見つかりませんでした。ポップアップから開き直してください。');
    return;
  }

  document.title = `${folder.name} の出題 | Moodle Quiz Scraper`;
  $('folderName').textContent = folder.name;

  quizFolder = folder;
  storageKey = 'moodle-round-results:v1:' + encodeURIComponent(folder.name);
  loadHistory();
  $('folderInfo').textContent = `全${folder.quizzes.length}回 ／ ${folder.quizzes.reduce((n, q) => n + q.questions.length, 0)}問`;
  renderSelection();
  renderHistory();
  $('backButton').addEventListener('click', () => {
    if (state.current && !confirm('受験を終了して回の選択へ戻りますか？ 途中の結果は保存されません。')) return;
    state.current = null;
    $('exam').classList.add('hidden');
    $('selection').classList.remove('hidden');
    renderSelection();
  });
  $('downloadHistory').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ subject: quizFolder.name, results: historyRecords }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = quizFolder.name + '_受験履歴.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  $('nextButton').addEventListener('click', onNext);
  $('restartButton').addEventListener('click', () => {
    if (!state.current || confirm('この回を最初からやり直しますか？ 途中の結果は保存されません。')) restart();
  });
  $('resultRestart').addEventListener('click', restart);

  const exportButton = $('exportHtmlButton');
  if (embedded) {
    // 単体HTML内では再書き出しできない（chrome APIがない）ため非表示にする
    exportButton.classList.add('hidden');
  } else {
    exportButton.addEventListener('click', () => exportStandaloneHtml(folder));
  }

};

init();
